
<!DOCTYPE html><html><head><link rel='stylesheet' href='/static/css/style.css'><title>Dashboard</title></head>
<body><div class='header'><h1>Case Dashboard</h1></div>
<div class='container'><div class='card'><table>
<tr><th>ID</th><th>Name</th><th>Email</th><th>Type</th><th>Status</th><th>Description</th><th>File</th></tr>
{% for c in cases %}
<tr><td>{{c[0]}}</td><td>{{c[1]}}</td><td>{{c[2]}}</td><td>{{c[4]}}</td><td>{{c[6]}}</td><td>{{c[5]}}</td><td>{{c[7]}}</td></tr>
{% endfor %}
</table></div></div></body></html>
